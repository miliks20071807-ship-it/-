name: Deploy agent

on:
  # ПРИЗУПИНЕНО (рішення команди): деплой-агент поки що сканує лише
  # цей самий репозиторій (бота), не реальний продукт — щогодинний
  # автозапуск не давав користі, лише шум сповіщень. Розкоментуйте
  # блок schedule нижче, коли деплой-агента підключать до
  # репозиторію мобільного застосунку.
  # schedule:
  #   - cron: "0 * * * *"   # раз на годину
  workflow_dispatch: {}    # ручний запуск (вкладка Actions чи тег @деплой) лишається доступним

permissions:
  contents: write
  pull-requests: write

env:
  # Сповіщення деплой-агента йдуть від окремого "деплой-бота" (своя
  # ідентичність у Telegram). Якщо секрет TELEGRAM_DEPLOY_BOT_TOKEN не
  # заданий — падає назад на звичайного TELEGRAM_BOT_TOKEN.
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEPLOY_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
  # GH_PAT (не автоматичний secrets.GITHUB_TOKEN) — інакше відкритий/
  # змерджений тут PR не тригерне review-agent.yml/changelog-agent.yml:
  # GitHub навмисно не запускає інші workflow на події, створені
  # автоматичним токеном (той самий трюк, що вже був потрібен у ci.yml
  # для тригера bugfix-agent.yml).
  GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_DAILY_CALL_LIMIT: ${{ vars.ANTHROPIC_DAILY_CALL_LIMIT || '200' }}

jobs:
  scan-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest ruff

      # Раннер ефемерний (новий щоразу) — без кешу api_usage.json
      # "денний" лічильник скидався б щогодини й ліміт був би
      # неможливо досягти. Ключ на run_id завжди унікальний (завжди
      # save в кінці job'а), restore-keys-префікс підхоплює найсвіжіший
      # попередній кеш; саму логіку "новий день — обнулити" робить
      # api_usage.py._load() за датою всередині файлу.
      - name: Кеш лічильника Anthropic API
        uses: actions/cache@v4
        with:
          path: api_usage.json
          key: api-usage-${{ github.run_id }}
          restore-keys: |
            api-usage-

      - name: git identity
        run: |
          git config user.name "deploy-agent"
          git config user.email "deploy-agent@users.noreply.github.com"

      # --- Кожен крок нижче одразу шле статус у Telegram через curl —
      # так весь прогрес видно без заходу на GitHub. ---
      - name: "Telegram: почав перевірку"
        continue-on-error: true
        run: |
          bash .github/scripts/telegram_notify.sh text "🚀 Деплой-агент почав перевірку репозиторію"

      - name: Автофікс (ruff)
        id: autofix
        run: python agents/deploy_agent.py autofix

      - name: "Telegram: репозиторій чистий"
        if: steps.autofix.outputs.has_changes != 'true'
        continue-on-error: true
        run: |
          bash .github/scripts/telegram_notify.sh text "✅ Деплой-агент: змін не потрібно, репозиторій чистий"

      - name: Тести
        id: test
        if: steps.autofix.outputs.has_changes == 'true'
        run: python agents/deploy_agent.py test

      - name: "Telegram: тести пройшли"
        if: steps.autofix.outputs.has_changes == 'true' && steps.test.outputs.passed == 'true'
        continue-on-error: true
        run: |
          bash .github/scripts/telegram_notify.sh text "🧪 Деплой-агент: тести пройшли, відкриваю PR"

      - name: Відкинути зміни (тести не пройшли)
        if: steps.autofix.outputs.has_changes == 'true' && steps.test.outputs.passed != 'true'
        run: git checkout -- .

      - name: "Telegram: тести не пройшли"
        if: steps.autofix.outputs.has_changes == 'true' && steps.test.outputs.passed != 'true'
        continue-on-error: true
        run: |
          bash .github/scripts/telegram_notify.sh text "❌ Деплой-агент: тести не пройшли після автофіксу, зміни відкинуто (PR не відкривався)"

      - name: Відкрити PR
        id: pr
        if: steps.autofix.outputs.has_changes == 'true' && steps.test.outputs.passed == 'true'
        run: python agents/deploy_agent.py open-pr

      - name: "Telegram: пропущено через денний ліміт Anthropic API"
        if: steps.pr.outputs.skipped == 'true' && steps.pr.outputs.should_warn == 'true'
        continue-on-error: true
        env:
          LIMIT: ${{ env.ANTHROPIC_DAILY_CALL_LIMIT }}
        run: |
          bash .github/scripts/telegram_notify.sh text "⚠️ Деплой-агент: пропустив цей прогін — денний ліміт Claude API вичерпано (${LIMIT} викликів). Автофікс лишився незакомічений, спробує знову наступного разу."

      - name: "Telegram: PR відкрито"
        if: steps.pr.outputs.pr_number
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          bash .github/scripts/telegram_notify.sh text "📬 Деплой-агент відкрив PR #${PR_NUMBER}: ${PR_URL}"

      - name: Автомердж тривіального PR
        id: merge
        if: steps.pr.outputs.trivial == 'true'
        run: python agents/deploy_agent.py merge-pr "${{ steps.pr.outputs.pr_number }}"

      - name: "Telegram: автомердж виконано"
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REASON: ${{ steps.pr.outputs.reason }}
        run: |
          bash .github/scripts/telegram_notify.sh text "🚀 Деплой-агент: автомердж PR #${PR_NUMBER} виконано (${REASON})"

      # Кнопки "Затвердити"/"Відхилити" — коли PR не тривіальний АБО
      # автомердж тривіального PR з якоїсь причини не вдався (напр.
      # branch protection вимагає review). Натискання обробляє bot.py.
      - name: "Telegram: потрібне підтвердження"
        if: steps.pr.outputs.pr_number != '' && (steps.pr.outputs.trivial != 'true' || steps.merge.outputs.merged == 'false')
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          REASON: ${{ steps.pr.outputs.reason }}
        run: |
          TEXT="🔍 Деплой-агент: PR #${PR_NUMBER} потребує підтвердження
          ${PR_URL}

          Причина: ${REASON}"
          bash .github/scripts/telegram_notify.sh approve "$TEXT" "${PR_NUMBER}"

      - name: "Telegram: аварійне завершення"
        if: failure()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash .github/scripts/telegram_notify.sh text "🔥 Деплой-агент завершився з помилкою. Деталі: ${RUN_URL}"
