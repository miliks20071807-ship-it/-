name: Deploy agent

on:
  schedule:
    - cron: "0 * * * *"   # раз на годину
  workflow_dispatch: {}    # можливість запустити вручну з вкладки Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  scan-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest ruff

      - name: git identity
        run: |
          git config user.name "deploy-agent"
          git config user.email "deploy-agent@users.noreply.github.com"

      - name: Run deploy agent
        run: python agents/deploy_agent.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
