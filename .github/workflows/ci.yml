name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest ruff

      # Один крок замість двох (ruff + pytest окремо) — так є один
      # файл виводу, який можна одразу вкласти в issue нижче. `run:`
      # для bash на GitHub Actions вже має -eo pipefail за замовчуванням,
      # тож крок коректно падає, якщо впаде ruff або pytest.
      - name: Lint and test
        run: |
          { ruff check . && pytest -q; } 2>&1 | tee check_output.txt

      # Джерело помилок для багфікс-агента (крок 3): якщо тести впали
      # на main, відкриваємо issue з лейблом "bug" і повним логом
      # помилки в тілі — без реального тексту traceback багфікс-агент
      # не може безпечно запропонувати фікс (перевірено живим тестом:
      # issue лише з посиланням на прогін він чесно відхилив як
      # недостатньо інформації). Дедуп: не плодимо issue, якщо відкрита
      # така сама вже є.
      #
      # ВАЖЛИВО: створюємо issue через GH_PAT (персональний токен), а
      # не через стандартний secrets.GITHUB_TOKEN — GitHub навмисно не
      # дозволяє подіям, створеним автоматичним GITHUB_TOKEN, тригерити
      # інші workflow (захист від рекурсії). Тому issue, відкрита через
      # GITHUB_TOKEN, НЕ запустила б bugfix-agent.yml. Якщо GH_PAT не
      # заданий — issue все одно відкриється (через GITHUB_TOKEN), просто
      # без автотригера багфікс-агента.
      - name: Open bug issue on failure (main only)
        id: bug_issue
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          existing=$(gh issue list --label bug --state open --search "CI failure on main" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            {
              echo "Тести/лінт впали на main у ${{ github.sha }}."
              echo ""
              echo "Лог:"
              echo '```'
              tail -c 4000 check_output.txt 2>/dev/null || echo "(лог недоступний)"
              echo '```'
              echo ""
              echo "Деталі: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > issue_body.txt
            url=$(gh issue create \
              --title "CI failure on main ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --label bug \
              --body-file issue_body.txt)
            echo "opened_url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$existing вже відкрита, не дублюю."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: "Telegram: CI впав, відкрито issue"
        if: steps.bug_issue.outputs.opened_url
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BUGFIX_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          ISSUE_URL: ${{ steps.bug_issue.outputs.opened_url }}
        run: |
          bash .github/scripts/telegram_notify.sh text "🔥 CI впав на main, відкрито issue для багфікс-агента: ${ISSUE_URL}"
