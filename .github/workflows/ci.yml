name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pytest ruff

      - run: ruff check .

      - run: pytest -q

      # Джерело помилок для багфікс-агента (крок 3): якщо тести впали
      # на main, відкриваємо issue з лейблом "bug" — це тригерить
      # .github/workflows/bugfix-agent.yml. Дедуп: не плодимо issue,
      # якщо відкрита така сама вже є.
      - name: Open bug issue on failure (main only)
        id: bug_issue
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          existing=$(gh issue list --label bug --state open --search "CI failure on main" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            url=$(gh issue create \
              --title "CI failure on main ($(date -u +%Y-%m-%dT%H:%MZ))" \
              --label bug \
              --body "Тести/лінт впали на main у ${{ github.sha }}. Деталі: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            echo "opened_url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$existing вже відкрита, не дублюю."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Telegram: CI впав, відкрито issue"
        if: steps.bug_issue.outputs.opened_url
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          ISSUE_URL: ${{ steps.bug_issue.outputs.opened_url }}
        run: |
          bash .github/scripts/telegram_notify.sh text "🔥 CI впав на main, відкрито issue для багфікс-агента: ${ISSUE_URL}"
